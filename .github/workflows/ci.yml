name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --python 3.12
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q
      # Security gate: the build fails if the real retrieval path returns a single
      # chunk the asking user is not allowed to read, or any chunk from another tenant.
      - name: Leakage eval (security gate)
        run: uv run securerag eval --gate --min-recall 0.95

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: securerag:ci
      - name: Smoke test the container
        run: |
          docker run -d --name securerag -p 8000:8000 securerag:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/healthz && break; sleep 1; done
          curl -fs localhost:8000/healthz
          docker rm -f securerag
